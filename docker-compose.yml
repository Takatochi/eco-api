services:
  db:
    image: postgres:16
    container_name: eco_db
    environment:
      POSTGRES_DB: eco
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: eco
    ports:
      - "5432:5432"
    volumes:
      - eco_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco -d eco"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg_admin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@domain.com"
      PGADMIN_DEFAULT_PASSWORD: "1234"
    ports:
      - "5050:80"
    depends_on:
      - db

  # Optional local blockchain (for section 3 demonstration):
  # 1) Deploy blockchain/contracts/DataAnchor.sol to this node.
  # 2) Put deployed address into BLOCKCHAIN_CONTRACT_ADDRESS for api service.
  blockchain:
    image: trufflesuite/ganache:v7.9.1
    container_name: eco_blockchain
    command: --wallet.totalAccounts 5 --wallet.defaultBalance 1000 --chain.chainId 1337 --server.host 0.0.0.0
    ports:
      - "8545:8545"
  api:
    build: .
    container_name: eco_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eco:eco@db:5432/eco?sslmode=disable
      PORT: "8080"
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_FROM_ADDRESS: ${BLOCKCHAIN_FROM_ADDRESS:-}
    ports:
      - "8080:8080"

  sensor-1:
    build: ./simulator
    container_name: sensor-1
    depends_on:
      - api
    environment:
      API_URL: http://api:8080/api/measurements
      DEVICE_ID: sensor-1
      INTERVAL_SEC: "2"
      WORKERS: "1"

  sensor-2:
    build: ./simulator
    container_name: sensor-2
    depends_on:
      - api
    environment:
      API_URL: http://api:8080/api/measurements
      DEVICE_ID: sensor-2
      INTERVAL_SEC: "1"
      WORKERS: "1"

  sensor-3:
    build: ./simulator
    container_name: sensor-3
    depends_on:
      - api
    environment:
      API_URL: http://api:8080/api/measurements
      DEVICE_ID: sensor-3
      INTERVAL_SEC: "5"
      WORKERS: "1"

  sensor-4:
    build: ./simulator
    container_name: sensor-4
    depends_on:
      - api
    environment:
      API_URL: http://api:8080/api/measurements
      DEVICE_ID: sensor-4
      INTERVAL_SEC: "3"
      WORKERS: "1"

volumes:
  eco_pgdata:
  blockscout_pg:
